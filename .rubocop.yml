plugins:
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# The main module is a cohesive unit - allow reasonable size
Metrics/ModuleLength:
  Max: 140

# The class << self block contains all public/private methods
Metrics/ClassLength:
  Max: 120

# Tests often have longer methods and higher complexity - that's fine
Metrics/MethodLength:
  Max: 18
  Exclude:
    - "test/**/*"

Metrics/AbcSize:
  Max: 18
  Exclude:
    - "test/**/*"

# Lock operations that report success as a boolean
Naming/PredicateMethod:
  AllowedMethods:
    - release
    - insert_lock
    - claim_expired
